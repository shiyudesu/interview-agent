  - id: database.jsonb.relational-modeling
    contentVersion: 1
    domain: database_storage
    difficulty: medium
    questionType: design
    sourceWording: "业务对象既有稳定的核心字段，也有随类型变化的扩展属性，请比较 PostgreSQL JSONB 与关系化建模，并说明何时适合采用混合方案。"
    rubric:
      - id: relational-model-strength
        description: "说明稳定且常用于过滤、关联和约束的字段适合关系列，以获得明确类型和完整性保证"
        weight: 35
      - id: jsonb-flexibility-cost
        description: "说明 JSONB 适合结构多样或演进较快的属性，但会把部分校验、关联和统计复杂度转移到应用与索引设计"
        weight: 35
      - id: hybrid-modeling-access
        description: "说明可将核心查询字段关系化、扩展属性放入 JSONB，并依据真实访问路径选择表达式或 GIN 索引"
        weight: 30
    followUpGoals:
      - id: jsonb-modeling-clarification
        kind: clarification
        goal: "澄清哪些属性需要强约束、频繁筛选、排序或关联"
      - id: jsonb-modeling-depth
        kind: depth
        goal: "说明扩展属性逐渐稳定或成为高频查询条件时如何演进模型"
    knowledgeExplanation: "关系列提供清晰类型、约束、关联和可预测统计，JSONB 提供更灵活的结构演进。常见方案是保留关系化核心，把低频且多变的属性放入 JSONB，并在访问模式稳定后将关键属性提升为关系字段。"
    active: true
    reviewed: true
    reviewMetadata:
      reviewedBy: database-storage-review
      reviewedAt: "2026-08-11T00:00:00Z"
      simplifiedChineseVerified: true
      technicalTermsVerified: true

  - id: database.backup.restore-failure
    contentVersion: 1
    domain: database_storage
    difficulty: medium
    questionType: scenario
    sourceWording: "生产数据库所在存储发生损坏，请说明如何用 RPO、RTO 设计备份与恢复方案，并在故障发生后判断是故障切换还是从备份恢复。"
    rubric:
      - id: recovery-objectives
        description: "说明 RPO 表示可接受的数据丢失窗口，RTO 表示可接受的服务恢复时间，两者决定成本和恢复机制"
        weight: 25
      - id: backup-recovery-chain
        description: "说明完整备份、增量能力或连续 WAL 归档需要形成可验证的恢复链，并保留独立故障域中的副本"
        weight: 25
      - id: restore-verification
        description: "说明必须定期执行恢复演练，验证备份可读、恢复时长、时间点恢复结果和应用一致性"
        weight: 25
      - id: storage-failure-response
        description: "说明先隔离故障与停止扩大损坏，再根据副本健康、数据一致性和恢复目标选择切换、回滚或恢复"
        weight: 25
    followUpGoals:
      - id: backup-failure-clarification
        kind: clarification
        goal: "澄清故障影响单个磁盘、整个节点还是多个副本所在的共同存储"
      - id: backup-failure-depth
        kind: depth
        goal: "说明副本已经复制逻辑损坏时，如何选择可信恢复点并验证业务一致性"
    knowledgeExplanation: "备份策略必须从业务可接受的 RPO 和 RTO 反推，而不是只确认存在备份文件。副本适合快速接管部分故障，但可能同步错误或损坏；独立备份、连续日志、恢复演练和故障隔离共同决定系统能否可靠恢复。"
    active: true
    reviewed: true
    reviewMetadata:
      reviewedBy: database-storage-review
      reviewedAt: "2026-08-11T00:00:00Z"
      simplifiedChineseVerified: true
      technicalTermsVerified: true
