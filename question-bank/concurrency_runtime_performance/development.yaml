questions:
  - id: concurrency.channel.close-ownership
    contentVersion: 1
    domain: concurrency_runtime_performance
    difficulty: medium
    questionType: design
    sourceWording: "请说明并发流程中由谁关闭 channel，以及错误的关闭责任会带来什么风险。"
    rubric:
      - id: channel-owner
        description: "说明通常由明确知道不再发送数据的一方负责关闭"
        weight: 45
      - id: channel-risks
        description: "说明重复关闭或向已关闭 channel 发送数据会触发运行时错误"
        weight: 35
      - id: channel-receive
        description: "说明接收方可通过关闭状态判断数据流结束"
        weight: 20
    followUpGoals:
      - id: channel-clarification
        kind: clarification
        goal: "澄清发送方和接收方各自掌握的信息"
      - id: channel-depth
        kind: depth
        goal: "说明多个发送方场景中的协调方式"
    knowledgeExplanation: "channel 的关闭应由拥有发送生命周期的一方协调，关闭只表示后续不再发送数据，不用于广播任意状态。"
    active: true
    reviewed: true
    reviewMetadata:
      reviewedBy: development-fixture-review
      reviewedAt: "2026-08-10T00:00:00Z"
      simplifiedChineseVerified: true
      technicalTermsVerified: true

  - id: concurrency.mutex.atomic-tradeoff
    contentVersion: 1
    domain: concurrency_runtime_performance
    difficulty: medium
    questionType: conceptual
    sourceWording: "请比较 mutex 与 atomic 在并发状态保护中的适用场景和主要取舍。"
    rubric:
      - id: atomic-scope
        description: "说明 atomic 适合简单且边界清晰的单值状态变更"
        weight: 35
      - id: mutex-invariant
        description: "说明 mutex 更适合保护多个字段组成的不变量"
        weight: 40
      - id: maintainability
        description: "说明性能之外还要考虑可读性、正确性和竞争程度"
        weight: 25
    followUpGoals:
      - id: synchronization-clarification
        kind: clarification
        goal: "澄清需要保护的是单个值还是复合状态"
      - id: synchronization-depth
        kind: depth
        goal: "说明如何通过竞争分析验证同步策略"
    knowledgeExplanation: "atomic 提供低层级原子操作，mutex 能表达更大的临界区；选择应优先保证不变量和可维护性。"
    active: true
    reviewed: true
    reviewMetadata:
      reviewedBy: development-fixture-review
      reviewedAt: "2026-08-10T00:00:00Z"
      simplifiedChineseVerified: true
      technicalTermsVerified: true

  - id: runtime.goroutine.leak-diagnosis
    contentVersion: 1
    domain: concurrency_runtime_performance
    difficulty: medium
    questionType: troubleshooting
    sourceWording: "请分析 Go 服务中 goroutine 数量持续增长的常见原因和排查思路。"
    rubric:
      - id: leak-causes
        description: "说明阻塞的 channel、网络调用或缺失取消信号等常见原因"
        weight: 45
      - id: leak-observation
        description: "说明结合 goroutine profile、指标和调用栈定位阻塞位置"
        weight: 35
      - id: leak-lifecycle
        description: "说明为后台任务定义退出条件和生命周期所有者"
        weight: 20
    followUpGoals:
      - id: leak-clarification
        kind: clarification
        goal: "澄清增长发生的时间范围和关联请求"
      - id: leak-depth
        kind: depth
        goal: "说明如何区分正常并发波动和持续泄漏"
    knowledgeExplanation: "goroutine 泄漏通常来自无法结束的阻塞或失去所有者的后台任务，需要结合运行时剖析和生命周期设计定位。"
    active: true
    reviewed: true
    reviewMetadata:
      reviewedBy: development-fixture-review
      reviewedAt: "2026-08-10T00:00:00Z"
      simplifiedChineseVerified: true
      technicalTermsVerified: true

  - id: runtime.scheduler.gmp-work-stealing
    contentVersion: 1
    domain: concurrency_runtime_performance
    difficulty: medium
    questionType: conceptual
    sourceWording: "请解释 Go 调度器中 G、M、P 的职责，以及本地运行队列、工作窃取和阻塞操作如何影响 goroutine 调度。"
    rubric:
      - id: gmp-responsibilities
        description: "说明 G 表示待执行的 goroutine，M 表示操作系统线程，P 持有执行 Go 任务所需的调度资源"
        weight: 40
      - id: scheduler-queues
        description: "说明本地运行队列与工作窃取用于分散调度压力并在不同 P 之间平衡可运行任务"
        weight: 35
      - id: scheduler-blocking
        description: "说明系统调用或网络等待可能使当前执行路径阻塞，运行时会通过线程切换、移交 P 或网络轮询维持其他任务推进"
        weight: 25
    followUpGoals:
      - id: gmp-clarification
        kind: clarification
        goal: "澄清 G、M、P 分别代表的运行时实体"
      - id: gmp-depth
        kind: depth
        goal: "说明系统调用阻塞和网络等待时调度器如何维持其他工作推进"
    knowledgeExplanation: "G 是 goroutine 的运行时表示，M 对应执行指令的操作系统线程，P 提供调度 Go 任务所需的上下文；运行时通过队列、工作窃取、网络轮询和 P 的移交提高并行资源利用率。"
    active: true
    reviewed: true
    reviewMetadata:
      reviewedBy: development-fixture-review
      reviewedAt: "2026-08-11T00:00:00Z"
      simplifiedChineseVerified: true
      technicalTermsVerified: true

  - id: concurrency.channel.buffering-select
    contentVersion: 1
    domain: concurrency_runtime_performance
    difficulty: medium
    questionType: conceptual
    sourceWording: "请比较无缓冲和有缓冲 channel 的同步语义，并说明 select 在多个通信条件同时就绪或均未就绪时的行为和风险。"
    rubric:
      - id: channel-buffer-semantics
        description: "说明无缓冲 channel 需要发送与接收直接配对，有缓冲 channel 可在容量范围内解耦双方进度"
        weight: 40
      - id: select-ready-cases
        description: "说明 select 会从已就绪分支中选择一个，均未就绪时默认阻塞，存在 default 时则立即执行该分支"
        weight: 35
      - id: buffering-tradeoffs
        description: "说明缓冲只能吸收有限波动，容量设置和 default 分支可能带来积压、丢弃、忙循环或公平性预期错误"
        weight: 25
    followUpGoals:
      - id: channel-buffer-clarification
        kind: clarification
        goal: "澄清缓冲容量改变的是同步边界还是业务正确性"
      - id: channel-select-depth
        kind: depth
        goal: "说明多个分支持续就绪时为何不能依赖固定优先级"
    knowledgeExplanation: "无缓冲 channel 强制发送方和接收方会合，有缓冲 channel 允许有限数量的数据暂存；select 在就绪分支间进行选择，但不提供业务优先级，default 使用不当还可能造成忙循环或绕过背压。"
    active: true
    reviewed: true
    reviewMetadata:
      reviewedBy: development-fixture-review
      reviewedAt: "2026-08-11T00:00:00Z"
      simplifiedChineseVerified: true
      technicalTermsVerified: true

  - id: concurrency.sync.once-waitgroup-cond
    contentVersion: 1
    domain: concurrency_runtime_performance
    difficulty: medium
    questionType: scenario
    sourceWording: "请比较 sync.Once、sync.WaitGroup 与 sync.Cond 各自解决的问题，并说明错误使用时可能出现的生命周期或唤醒问题。"
    rubric:
      - id: once-semantics
        description: "说明 Once 用于保证初始化动作至多执行一次，不能把失败后的自动重试当作其默认语义"
        weight: 30
      - id: waitgroup-lifecycle
        description: "说明 WaitGroup 用于等待一组任务结束，计数增加与任务启动、Done 调用和 Wait 之间必须保持正确生命周期"
        weight: 35
      - id: cond-predicate
        description: "说明 Cond 用于在锁保护的条件变化时通知等待者，等待方应在循环中重新检查条件且通知不会为未来等待者保存"
        weight: 35
    followUpGoals:
      - id: sync-primitives-clarification
        kind: clarification
        goal: "澄清需求是一次性初始化、等待任务结束还是等待共享条件变化"
      - id: sync-primitives-depth
        kind: depth
        goal: "说明通知发生后等待方为何仍需在持锁状态下重新检查条件"
    knowledgeExplanation: "Once、WaitGroup 和 Cond 分别表达一次性动作、任务完成汇合与条件等待。它们都依赖清晰的生命周期和同步边界，混用或误判通知语义容易造成提前返回、永久等待或遗漏状态变化。"
    active: true
    reviewed: true
    reviewMetadata:
      reviewedBy: development-fixture-review
      reviewedAt: "2026-08-11T00:00:00Z"
      simplifiedChineseVerified: true
      technicalTermsVerified: true

  - id: memory.happens-before-publication
    contentVersion: 1
    domain: concurrency_runtime_performance
    difficulty: medium
    questionType: conceptual
    sourceWording: "请解释 happens-before 关系为何是判断并发读写可见性和顺序的核心，并说明 mutex、channel 与原子操作如何建立同步边界。"
    rubric:
      - id: happens-before-meaning
        description: "说明 happens-before 描述一个操作的效果对另一个操作可见且顺序受保证，而不是依赖墙上时间或观察到的先后"
        weight: 40
      - id: synchronization-edges
        description: "说明 mutex 解锁与后续加锁、符合规则的 channel 通信及原子操作能够建立内存模型定义的同步关系"
        weight: 35
      - id: unsynchronized-publication
        description: "说明缺少同步地发布和读取共享状态会导致数据竞争，不能依赖处理器缓存或编译器碰巧产生的行为"
        weight: 25
    followUpGoals:
      - id: happens-before-clarification
        kind: clarification
        goal: "澄清实际执行时间先后与内存模型保证之间的区别"
      - id: happens-before-depth
        kind: depth
        goal: "说明安全发布共享对象需要同时保证引用和对象状态可见"
    knowledgeExplanation: "Go 内存模型用 happens-before 关系定义跨 goroutine 的可见性。锁、channel 和原子操作只在其文档规定的边界建立顺序；没有这些边界时，即使测试中结果稳定，也不能推导共享状态读取是正确的。"
    active: true
    reviewed: true
    reviewMetadata:
      reviewedBy: development-fixture-review
      reviewedAt: "2026-08-11T00:00:00Z"
      simplifiedChineseVerified: true
      technicalTermsVerified: true

  - id: concurrency.data-race-vs-race-condition
    contentVersion: 1
    domain: concurrency_runtime_performance
    difficulty: medium
    questionType: troubleshooting
    sourceWording: "请说明数据竞争与一般业务竞争条件的区别，以及为什么运行结果正常或增加 sleep 都不能证明并发流程正确。"
    rubric:
      - id: data-race-definition
        description: "说明数据竞争涉及对同一内存位置的并发访问，其中至少一个是写操作且缺少有效同步"
        weight: 40
      - id: race-condition-distinction
        description: "说明业务竞争条件是结果依赖事件顺序的更广泛逻辑问题，即使所有内存访问已同步也可能存在"
        weight: 30
      - id: race-detection-limits
        description: "说明 race detector 只能发现实际执行路径上的数据竞争，时间延迟和偶然成功不能替代同步设计与覆盖充分的测试"
        weight: 30
    followUpGoals:
      - id: race-distinction-clarification
        kind: clarification
        goal: "澄清问题属于未同步内存访问还是业务操作顺序不满足约束"
      - id: race-detection-depth
        kind: depth
        goal: "说明动态竞争检测为何不能证明未覆盖路径不存在数据竞争"
    knowledgeExplanation: "数据竞争是内存模型层面的未同步冲突访问，业务竞争条件则涵盖更广的时序依赖。race detector 能暴露已执行路径中的数据竞争，但 sleep 只改变调度概率，稳定结果也不构成正确性证明。"
    active: true
    reviewed: true
    reviewMetadata:
      reviewedBy: development-fixture-review
      reviewedAt: "2026-08-11T00:00:00Z"
      simplifiedChineseVerified: true
      technicalTermsVerified: true

  - id: concurrency.worker-pool.backpressure
    contentVersion: 1
    domain: concurrency_runtime_performance
    difficulty: medium
    questionType: design
    sourceWording: "请分析高流量服务中固定大小 worker pool、任务队列与 backpressure 的关系，以及队列持续堆积时应考虑哪些取舍。"
    rubric:
      - id: worker-concurrency-bound
        description: "说明固定数量的 worker 可以限制并发资源消耗，但容量应依据任务类型和下游承载能力确定"
        weight: 35
      - id: queue-accumulation
        description: "说明队列可吸收短时突发，持续积压则会增加内存占用、排队时间和尾延迟，并掩盖处理能力不足"
        weight: 35
      - id: backpressure-policy
        description: "说明有界队列、入口限流、拒绝、降级或取消等策略应提供明确反馈，而不是无限接收任务"
        weight: 30
    followUpGoals:
      - id: worker-pool-clarification
        kind: clarification
        goal: "澄清任务主要受 CPU、外部 I/O 还是下游配额限制"
      - id: worker-pool-depth
        kind: depth
        goal: "说明如何根据到达速率、服务时间和排队指标判断容量是否失衡"
    knowledgeExplanation: "worker pool 用有限并发保护 CPU、连接和下游服务，队列只适合缓冲有限突发。长期到达速率高于处理速率时，系统必须通过背压或准入策略限制工作量，否则延迟和资源占用会持续恶化。"
    active: true
    reviewed: true
    reviewMetadata:
      reviewedBy: development-fixture-review
      reviewedAt: "2026-08-11T00:00:00Z"
      simplifiedChineseVerified: true
      technicalTermsVerified: true

  - id: concurrency.cancellation.error-propagation
    contentVersion: 1
    domain: concurrency_runtime_performance
    difficulty: medium
    questionType: scenario
    sourceWording: "请说明带有多级 goroutine 的并发流程如何传播取消和错误，并分析未消费结果或阻塞操作不响应取消时产生泄漏的原因。"
    rubric:
      - id: cancellation-propagation
        description: "说明调用链应由明确所有者传播 context 取消或截止时间，各层阻塞操作需要观察取消信号"
        weight: 35
      - id: error-coordination
        description: "说明首个错误、剩余任务取消、结果收集和最终等待需要协调，避免调用方返回后仍有后台工作"
        weight: 35
      - id: blocked-result-leak
        description: "说明无人接收的发送、永不返回的外部调用或失去退出条件的接收会使 goroutine 长期阻塞"
        weight: 30
    followUpGoals:
      - id: cancellation-flow-clarification
        kind: clarification
        goal: "澄清取消信号的发起者、传播范围和最终等待责任"
      - id: cancellation-flow-depth
        kind: depth
        goal: "说明部分任务失败后如何避免结果生产方因无人消费而阻塞"
    knowledgeExplanation: "并发流程需要把取消、错误、结果和等待视为同一生命周期协议。仅让上层返回并不会自动停止下层 goroutine；每个可能阻塞的边界都应有退出条件，所有者还需等待已启动任务完成清理。"
    active: true
    reviewed: true
    reviewMetadata:
      reviewedBy: development-fixture-review
      reviewedAt: "2026-08-11T00:00:00Z"
      simplifiedChineseVerified: true
      technicalTermsVerified: true

  - id: runtime.gc.pacing-write-barrier
    contentVersion: 1
    domain: concurrency_runtime_performance
    difficulty: medium
    questionType: conceptual
    sourceWording: "请解释 Go GC 的并发标记与 pacing 目标，以及 write barrier 为什么会影响 mutator 开销和对象可达性判断。"
    rubric:
      - id: gc-concurrent-phases
        description: "说明 GC 大部分标记工作与应用并发进行，但仍存在需要短暂停顿或协助回收工作的阶段"
        weight: 35
      - id: gc-pacing
        description: "说明 pacing 根据分配速度、堆增长目标和内存限制调节回收时机与 CPU 投入，以平衡内存和执行开销"
        weight: 35
      - id: write-barrier-purpose
        description: "说明并发标记期间指针关系仍会变化，write barrier 用于维持可达性信息正确，同时增加写路径成本"
        weight: 30
    followUpGoals:
      - id: gc-pacing-clarification
        kind: clarification
        goal: "澄清 GC 目标是完全消除暂停还是控制内存、CPU 与暂停之间的平衡"
      - id: gc-barrier-depth
        kind: depth
        goal: "说明高分配率为何可能让应用承担更多 GC assist 并影响尾延迟"
    knowledgeExplanation: "Go GC 通过并发标记减少长暂停，pacer 根据堆增长和分配速度安排回收并控制辅助工作。并发标记时对象图持续变化，write barrier 记录必要的指针更新以保持标记正确，但会给应用写操作带来额外开销。"
    active: true
    reviewed: true
    reviewMetadata:
      reviewedBy: development-fixture-review
      reviewedAt: "2026-08-11T00:00:00Z"
      simplifiedChineseVerified: true
      technicalTermsVerified: true

  - id: runtime.allocation.escape-profiling
    contentVersion: 1
    domain: concurrency_runtime_performance
    difficulty: medium
    questionType: troubleshooting
    sourceWording: "请说明逃逸分析、分配率与 GC 压力之间的关系，并描述如何结合 benchmark、allocs、heap profile 和 CPU profile 避免凭感觉优化。"
    rubric:
      - id: escape-allocation
        description: "说明编译器会根据值的生命周期和使用方式决定其是否需要堆分配，逃逸结论本身不等于一定存在性能问题"
        weight: 35
      - id: allocation-gc-pressure
        description: "说明持续堆分配会增加分配器、扫描和回收工作，存活对象与短命对象对内存占用和 GC 成本的影响不同"
        weight: 35
      - id: profiling-evidence
        description: "说明 benchmark 与 allocs 用于比较稳定工作负载，heap profile 定位分配或保留，CPU profile 定位实际计算热点"
        weight: 30
    followUpGoals:
      - id: allocation-clarification
        kind: clarification
        goal: "澄清关注的是累计分配、当前保留内存还是 CPU 时间"
      - id: allocation-depth
        kind: depth
        goal: "说明优化前后为何需要保持工作负载一致并同时观察分配与延迟指标"
    knowledgeExplanation: "逃逸分析影响对象的存放位置，堆分配率和对象存活时间共同决定 GC 压力。不同 profile 回答的问题不同，优化应从可重复的基准和剖析证据出发，并验证资源下降是否真正改善目标延迟或吞吐量。"
    active: true
    reviewed: true
    reviewMetadata:
      reviewedBy: development-fixture-review
      reviewedAt: "2026-08-11T00:00:00Z"
      simplifiedChineseVerified: true
      technicalTermsVerified: true

  - id: concurrency.mutex.contention-profiling
    contentVersion: 1
    domain: concurrency_runtime_performance
    difficulty: medium
    questionType: troubleshooting
    sourceWording: "请分析 mutex 竞争对吞吐量和尾延迟的影响，并说明如何利用 mutex profile、block profile 和临界区指标定位瓶颈。"
    rubric:
      - id: contention-impact
        description: "说明热点锁会串行化并发工作，等待时间随负载上升并可能放大请求尾延迟"
        weight: 35
      - id: contention-causes
        description: "说明临界区过长、锁内执行阻塞操作、共享粒度过大或访问高度偏斜都可能形成竞争"
        weight: 35
      - id: contention-evidence
        description: "说明 mutex profile 观察锁等待，block profile 观察阻塞位置，并结合持锁时间和业务指标验证改动效果"
        weight: 30
    followUpGoals:
      - id: mutex-contention-clarification
        kind: clarification
        goal: "澄清瓶颈来自持锁时间、竞争频率还是锁保护的数据热点"
      - id: mutex-contention-depth
        kind: depth
        goal: "说明缩小临界区、分片或改变所有权模型各自可能引入的复杂度"
    knowledgeExplanation: "锁竞争不仅消耗 CPU，还会让请求排队并放大尾延迟。定位时应把 profile 中的等待位置与持锁时长、调用频率和负载变化对应起来，再评估缩短临界区、降低共享或分片是否值得额外复杂度。"
    active: true
    reviewed: true
