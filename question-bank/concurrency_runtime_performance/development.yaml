  - id: performance.latency-throughput.tradeoffs
    contentVersion: 1
    domain: concurrency_runtime_performance
    difficulty: medium
    questionType: design
    sourceWording: "请比较批处理、并发度、队列长度和资源利用率对吞吐量、平均延迟与尾延迟的影响，并说明为什么最大化吞吐量不一定适合在线请求。"
    rubric:
      - id: batching-tradeoff
        description: "说明批处理可摊薄固定成本并提高吞吐量，但等待凑批会增加单个请求延迟"
        weight: 30
      - id: saturation-queueing
        description: "说明过高并发和资源利用率会引发排队、竞争与下游拥塞，队列增长通常先恶化尾延迟"
        weight: 40
      - id: service-objectives
        description: "说明容量决策应依据负载形态和延迟目标保留余量，并通过有界队列或负载保护避免无限排队"
        weight: 30
    followUpGoals:
      - id: latency-throughput-clarification
        kind: clarification
        goal: "澄清系统优先目标是离线总处理量还是在线请求的延迟分位数"
      - id: latency-throughput-depth
        kind: depth
        goal: "说明接近资源饱和时平均延迟尚可而高分位延迟快速恶化的原因"
    knowledgeExplanation: "吞吐量优化常通过批处理和提高并发摊薄固定成本，但在线系统还受排队和尾延迟约束。资源接近饱和后，小幅负载波动就可能形成长队列，因此需要容量余量、边界和明确的服务目标。"
