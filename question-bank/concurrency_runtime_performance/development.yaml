  - id: performance.cache.false-sharing-locality
    contentVersion: 1
    domain: concurrency_runtime_performance
    difficulty: medium
    questionType: conceptual
    sourceWording: "请解释 false sharing 与数据局部性如何影响多核 Go 服务性能，并说明为什么逻辑上独立的字段仍可能相互干扰。"
    rubric:
      - id: cache-line-coherence
        description: "说明 CPU 缓存以 cache line 为单位维护一致性，同一缓存行上的独立数据仍会共享失效和传输成本"
        weight: 40
      - id: locality-impact
        description: "说明连续访问和紧凑布局通常有利于缓存命中，而跨核频繁写入相邻热点字段会造成 false sharing"
        weight: 35
      - id: layout-tradeoffs
        description: "说明分片、批量处理或调整布局可能降低争用，但 padding 会增加内存占用且应通过测量验证"
        weight: 25
    followUpGoals:
      - id: false-sharing-clarification
        kind: clarification
        goal: "澄清共享的是同一逻辑变量还是同一 cache line"
      - id: cache-locality-depth
        kind: depth
        goal: "说明改善写入隔离与保持读取局部性之间可能存在的取舍"
    knowledgeExplanation: "处理器按 cache line 传输并维护缓存一致性，因此不同 goroutine 更新同一缓存行内的独立字段时也可能反复使彼此缓存失效。布局和访问顺序会影响命中率，但填充或分片会增加内存与维护成本。"
