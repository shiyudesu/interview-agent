  - id: http.proxy-headers.trust
    contentVersion: 1
    domain: http_rpc_api
    difficulty: medium
    questionType: scenario
    sourceWording: "服务部署在多层反向代理之后，请说明如何安全使用 Forwarded、X-Forwarded-For、X-Forwarded-Proto 和 Host 信息。"
    rubric:
      - id: trusted-proxy-boundary
        description: "说明只有来自已配置可信代理的转发头才能作为依据，直连客户端提供的同名头必须忽略或覆盖"
        weight: 30
      - id: forwarding-chain
        description: "说明客户端地址需要按可信代理链规则解析，不能简单取最左或最右值而不验证每一跳"
        weight: 25
      - id: host-validation
        description: "说明 Host 或转发主机仍需允许列表校验，生成绝对链接和重定向时宜使用配置的规范外部地址"
        weight: 25
      - id: security-impact
        description: "说明错误信任会影响来源审计、限流、访问控制、重定向、绝对链接和安全 cookie 判断"
        weight: 20
    followUpGoals:
      - id: proxy-trust-clarification
        kind: clarification
        goal: "澄清哪些网络入口和代理层由服务运营方控制"
      - id: proxy-trust-depth
        kind: depth
        goal: "说明代理层数量变化或绕过代理直连时如何保持信任边界"
    knowledgeExplanation: "转发头只是可伪造的请求数据，只有经过可信代理链规范化后才能代表原始客户端和协议；主机信息还需允许列表或规范外部地址校验。服务必须明确可信代理并防止绕过代理造成安全策略误判。"
