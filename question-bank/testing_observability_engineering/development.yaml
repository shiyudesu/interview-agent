  - id: engineering.dependency.canary-rollback
    contentVersion: 1
    domain: testing_observability_engineering
    difficulty: medium
    questionType: scenario
    sourceWording: "一次关键依赖升级可能改变性能和兼容性，请说明升级前验证、金丝雀发布、逐步扩量与回滚条件应如何配合降低风险。"
    rubric:
      - id: dependency-upgrade-assessment
        description: "说明应审查变更记录、兼容范围、安全修复、弃用项和迁移要求，并在接近生产的环境验证关键契约"
        weight: 35
      - id: canary-progressive-rollout
        description: "说明先向小比例代表性流量发布，比较错误率、延迟、资源、业务指标和日志，再按观察窗口逐步扩量"
        weight: 35
      - id: rollback-readiness
        description: "说明预先定义自动暂停与回滚阈值，并确认数据库或数据格式变更具有向前向后兼容性和可恢复路径"
        weight: 30
    followUpGoals:
      - id: dependency-rollout-clarification
        kind: clarification
        goal: "澄清依赖升级是否涉及协议、持久化格式或运行时资源行为变化"
      - id: dependency-rollout-depth
        kind: depth
        goal: "说明金丝雀结果如何与基线对照，以及不可逆数据迁移为何会限制快速回滚"
    knowledgeExplanation: "依赖升级既可能修复风险，也可能引入兼容和性能回归。安全发布需要前置契约验证、代表性金丝雀、分阶段扩量和明确停止条件；涉及持久化格式时还必须先保证版本共存与数据恢复能力。"
    active: true
    reviewed: true
    reviewMetadata:
      reviewedBy: testing-observability-engineering-review
      reviewedAt: "2026-08-11T00:00:00Z"
      simplifiedChineseVerified: true
      technicalTermsVerified: true

  - id: engineering.capacity.headroom
    contentVersion: 1
    domain: testing_observability_engineering
    difficulty: medium
    questionType: design
    sourceWording: "业务预计三个月后流量翻倍，请说明容量规划如何结合需求模型、负载测试、瓶颈识别、安全余量和扩容验证。"
    rubric:
      - id: capacity-demand-model
        description: "说明根据峰值流量、请求组合、增长趋势、数据规模和服务等级建立需求模型，而不是只看平均利用率"
        weight: 35
      - id: capacity-load-bottleneck
        description: "说明负载测试应接近真实请求分布并观察吞吐、尾延迟、队列、连接池和下游限制以识别瓶颈"
        weight: 35
      - id: capacity-headroom-validation
        description: "说明为突发、故障转移和扩容延迟保留安全余量，设置容量阈值，并定期验证自动或人工扩容路径"
        weight: 30
    followUpGoals:
      - id: capacity-planning-clarification
        kind: clarification
        goal: "澄清增长来自请求数量、单次请求成本、数据规模还是流量峰值变化"
      - id: capacity-planning-depth
        kind: depth
        goal: "说明失去一个可用区或关键下游降速时，安全余量应如何调整"
    knowledgeExplanation: "容量规划把业务需求转换为资源和依赖约束，需要关注峰值、尾延迟和故障情形。负载测试用于校准模型和发现瓶颈，安全余量覆盖突发与故障转移，扩容机制本身也必须定期演练和观测。"
    active: true
    reviewed: true
    reviewMetadata:
      reviewedBy: testing-observability-engineering-review
      reviewedAt: "2026-08-11T00:00:00Z"
      simplifiedChineseVerified: true
      technicalTermsVerified: true
