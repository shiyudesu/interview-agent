name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          check-latest: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.20.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check workspace boundaries
        run: pnpm workspace:check

      - name: Validate question bank
        run: pnpm question-bank:validate:release

      - name: Validate model evaluation fixtures
        run: pnpm model-quality:validate

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Verify TypeScript toolchain compatibility
        run: pnpm compatibility:typescript

      - name: Test
        run: pnpm test

      - name: Browser tests
        run: PLAYWRIGHT_CHROME_PATH="$(command -v google-chrome)" pnpm test:e2e

      - name: Build
        run: pnpm build
